<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG Academy — Painel do Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #000;
  --white: #fff;
  --accent: #C8F047;
  --accent2: #9EE020;
  --gray-500: #888;
  --gray-700: #444;
  --gray-800: #222;
  --gray-900: #111;
  --surface: #0d0d0d;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --display: 'Bebas Neue', sans-serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

html, body { height: 100%; }
body { visibility: hidden; }
body { background: var(--black); color: var(--white); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

body::after {
  content: '';
  position: fixed; inset: -200%;
  width: 400%; height: 400%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9998;
  animation: grain 0.6s steps(2) infinite; opacity: 0.25;
}
@keyframes grain { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-2%,-2%)} 50%{transform:translate(2%,2%)} 80%{transform:translate(-1%,1%)} }

.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; width: 240px; height: 100vh;
  z-index: 50; overflow-y: auto;
}

.sidebar-top { padding: 32px 24px 24px; border-bottom: 1px solid var(--border); }

.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; text-decoration: none; }
.logo-sq { width: 28px; height: 28px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 13px; color: var(--black); flex-shrink: 0; }
.logo-name { font-family: var(--display); font-size: 17px; letter-spacing: 0.06em; color: var(--white); }

.user-card { display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 36px; height: 36px; background: rgba(200,240,71,0.15); border: 1px solid rgba(200,240,71,0.3); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 14px; color: var(--accent); flex-shrink: 0; border-radius: 2px; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-family: var(--mono); font-size: 9px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }

.nav { padding: 16px 0; flex: 1; }
.nav-section { padding: 0 16px; margin-bottom: 4px; }
.nav-label { font-family: var(--mono); font-size: 9px; color: var(--gray-700); letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 8px 6px; }

.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; font-weight: 500; color: var(--gray-500); cursor: pointer; border-radius: 4px; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; text-decoration: none; position: relative; }
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--white); }
.nav-item.active { background: rgba(200,240,71,0.08); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 10px; }
.nav-icon { width: 16px; height: 16px; opacity: 0.6; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }

.nav-badge { position: absolute; right: 12px; background: var(--accent); color: var(--black); font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 2px; }

.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.btn-logout { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 10px; color: var(--gray-700); background: transparent; border: none; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; width: 100%; }
.btn-logout:hover { color: var(--white); }

/* ── MAIN ── */
.main { margin-left: 240px; min-height: 100vh; display: flex; flex-direction: column; }

.topbar { padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 40; }
.topbar-title { font-family: var(--display); font-size: 22px; letter-spacing: 0.04em; color: var(--white); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.badge-status { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid rgba(200,240,71,0.2); background: rgba(200,240,71,0.06); font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.status-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

.content { flex: 1; padding: 40px; }

.section { display: none; }
.section.active { display: block; animation: fadeUp 0.4s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* ── OVERVIEW STATS ── */
.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 32px; }
.stat-card { background: var(--black); padding: 28px 24px; transition: background 0.2s; }
.stat-card:hover { background: var(--surface); }
.stat-label { font-family: var(--mono); font-size: 9px; color: var(--gray-700); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.stat-value { font-family: var(--display); font-size: 40px; color: var(--white); line-height: 1; letter-spacing: -0.01em; margin-bottom: 4px; }
.stat-value.accent { color: var(--accent); }
.stat-sub { font-size: 11px; color: var(--gray-500); }

/* ── PENDENTES ── */
.pendentes-section { margin-bottom: 32px; }
.section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.section-title { font-family: var(--display); font-size: 32px; letter-spacing: -0.01em; color: var(--white); }
.section-sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }

.pendentes-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid rgba(200,240,71,0.15); }

.pendente-card { background: rgba(200,240,71,0.03); padding: 20px 24px; display: flex; align-items: center; gap: 16px; transition: background 0.2s; }
.pendente-card:hover { background: rgba(200,240,71,0.06); }

.pendente-avatar { width: 40px; height: 40px; background: rgba(200,240,71,0.1); border: 1px solid rgba(200,240,71,0.2); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 16px; color: var(--accent); flex-shrink: 0; }
.pendente-info { flex: 1; }
.pendente-name { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 2px; }
.pendente-meta { font-family: var(--mono); font-size: 10px; color: var(--gray-500); letter-spacing: 0.04em; }
.pendente-actions { display: flex; gap: 8px; }

.btn-aceitar { background: var(--accent); color: var(--black); border: none; padding: 8px 20px; font-family: var(--display); font-size: 14px; letter-spacing: 0.04em; cursor: pointer; transition: background 0.2s; }
.btn-aceitar:hover { background: var(--accent2); }
.btn-recusar { background: transparent; color: var(--gray-500); border: 1px solid var(--border2); padding: 8px 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
.btn-recusar:hover { border-color: rgba(255,255,255,0.3); color: var(--white); }

/* ── ALUNOS GRID ── */
.alunos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }

.aluno-card { background: var(--black); padding: 24px; cursor: pointer; transition: background 0.2s; position: relative; }
.aluno-card:hover { background: var(--surface); }

.aluno-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.aluno-avatar { width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 18px; color: var(--white); flex-shrink: 0; }
.aluno-info { flex: 1; min-width: 0; }
.aluno-name { font-size: 15px; font-weight: 600; color: var(--white); margin-bottom: 2px; }
.aluno-email { font-family: var(--mono); font-size: 10px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.aluno-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.aluno-stat { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 8px 10px; }
.aluno-stat-label { font-family: var(--mono); font-size: 9px; color: var(--gray-700); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.aluno-stat-val { font-family: var(--display); font-size: 18px; color: var(--white); }

.aluno-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.tag { display: inline-flex; padding: 3px 8px; border: 1px solid rgba(200,240,71,0.2); background: rgba(200,240,71,0.06); font-family: var(--mono); font-size: 9px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.tag-gray { border-color: var(--border2); background: transparent; color: var(--gray-500); }

.btn-enviar-treino { width: 100%; background: var(--accent); color: var(--black); border: none; padding: 10px; font-family: var(--display); font-size: 14px; letter-spacing: 0.04em; cursor: pointer; transition: background 0.2s; }
.btn-enviar-treino:hover { background: var(--accent2); }

/* ── EMPTY ── */
.empty-state { padding: 60px 40px; text-align: center; border: 1px solid var(--border); }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-title { font-family: var(--display); font-size: 24px; color: var(--gray-700); margin-bottom: 8px; letter-spacing: 0.04em; }
.empty-sub { font-size: 13px; color: var(--gray-700); }

/* ── LOADING ── */
.loading { display: flex; align-items: center; justify-content: center; padding: 60px; flex-direction: column; gap: 16px; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--mono); font-size: 11px; color: var(--gray-500); letter-spacing: 0.08em; text-transform: uppercase; }

/* ── MODAL TREINO ── */
#modal-treino { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
#modal-treino.open { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border2); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; animation: fadeUp 0.3s ease both; }
.modal-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 10; }
.modal-title { font-family: var(--display); font-size: 24px; letter-spacing: 0.04em; }
.btn-close { background: transparent; border: none; color: var(--gray-500); cursor: pointer; padding: 4px; display: flex; transition: color 0.2s; }
.btn-close:hover { color: var(--white); }
.modal-body { padding: 28px 32px; }
.modal-footer { padding: 20px 32px; border-top: 1px solid var(--border); }

/* ── FORM ── */
.form-field { margin-bottom: 16px; }
.form-label { display: block; font-family: var(--mono); font-size: 10px; color: var(--gray-500); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.form-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border2); padding: 12px 16px; font-size: 14px; color: var(--white); font-family: var(--sans); outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: rgba(200,240,71,0.4); }
.form-input::placeholder { color: var(--gray-700); }

.exercicio-row { display: grid; grid-template-columns: 1fr 70px 70px 90px auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.btn-add-ex { display: flex; align-items: center; gap: 8px; padding: 10px 0; font-family: var(--mono); font-size: 10px; color: var(--accent); background: transparent; border: none; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; transition: opacity 0.2s; margin-bottom: 20px; }
.btn-add-ex:hover { opacity: 0.7; }
.btn-remove-ex { width: 28px; height: 28px; background: transparent; border: 1px solid var(--border2); color: var(--gray-500); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
.btn-remove-ex:hover { border-color: rgba(255,255,255,0.3); color: var(--white); }

.btn-salvar { background: var(--accent); color: var(--black); border: none; padding: 14px 36px; font-family: var(--display); font-size: 18px; letter-spacing: 0.06em; cursor: pointer; transition: background 0.2s; }
.btn-salvar:hover { background: var(--accent2); }

/* ── TOAST ── */
#toast { position: fixed; bottom: 32px; right: 32px; background: var(--accent); color: var(--black); padding: 12px 20px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; z-index: 9000; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
#toast.show { transform: translateY(0); opacity: 1; }

/* ── ALUNO DETAIL MODAL ── */
#modal-aluno { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); align-items: flex-start; justify-content: flex-end; }
#modal-aluno.open { display: flex; }
.aluno-panel { background: var(--surface); border-left: 1px solid var(--border2); width: 100%; max-width: 480px; height: 100vh; overflow-y: auto; animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1) both; }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
.panel-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 10; }
.panel-body { padding: 28px 32px; }

.info-block { background: var(--black); border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }
.info-block-title { font-family: var(--display); font-size: 14px; letter-spacing: 0.06em; color: var(--white); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.info-block-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.info-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.info-row:last-child { border-bottom: none; }
.info-key { font-family: var(--mono); font-size: 10px; color: var(--gray-500); letter-spacing: 0.08em; text-transform: uppercase; }
.info-val { font-size: 13px; font-weight: 500; color: var(--white); }

.treinos-do-aluno { margin-top: 8px; }
.treino-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.treino-item:last-child { border-bottom: none; }
.treino-item-nome { font-size: 13px; font-weight: 500; color: var(--white); margin-bottom: 2px; }
.treino-item-meta { font-family: var(--mono); font-size: 10px; color: var(--gray-500); }
.treino-status { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; }
.status-concluido { background: rgba(200,240,71,0.08); color: var(--accent); border: 1px solid rgba(200,240,71,0.2); }
.status-pendente { background: rgba(255,255,255,0.03); color: var(--gray-500); border: 1px solid var(--border); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .topbar { padding: 16px 20px; }
  .content { padding: 20px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .alunos-grid { grid-template-columns: 1fr; }
  .exercicio-row { grid-template-columns: 1fr 60px 60px auto; }
}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="logo">
        <div class="logo-sq">BG</div>
        <span class="logo-name">BG ACADEMY</span>
      </a>
      <div class="user-card">
        <div class="user-avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Carregando...</div>
          <div class="user-role">Personal</div>
        </div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Menu</div>
        <button class="nav-item active" onclick="showSection('overview', this)">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
          Visão Geral
        </button>
        <button class="nav-item" onclick="showSection('alunos', this)">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Meus Alunos
          <span class="nav-badge" id="badge-alunos" style="display:none;">0</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2h3v10H9M5 4L2 7l3 3M2 7h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">VISÃO GERAL</div>
      <div class="topbar-right">
        <div class="badge-status">
          <div class="status-dot"></div>
          <span id="topbar-user">Personal</span>
        </div>
      </div>
    </div>

    <div class="content">

      <!-- OVERVIEW -->
      <section class="section active" id="section-overview">
        <div id="overview-loading" class="loading">
          <div class="spinner"></div>
          <div class="loading-text">Carregando painel...</div>
        </div>
        <div id="overview-content" style="display:none;">
          <div class="stats-row" id="stats-grid"></div>

          <div id="pendentes-section" class="pendentes-section" style="display:none;">
            <div class="section-header">
              <div>
                <div class="section-title">Solicitações pendentes</div>
                <div class="section-sub">Alunos aguardando sua confirmação</div>
              </div>
            </div>
            <div class="pendentes-list" id="pendentes-list"></div>
          </div>

          <div class="section-header" style="margin-top:8px;">
            <div>
              <div class="section-title">Alunos ativos</div>
              <div class="section-sub">Seus alunos com vínculo confirmado</div>
            </div>
          </div>
          <div id="ativos-list"></div>
        </div>
      </section>

      <!-- ALUNOS -->
      <section class="section" id="section-alunos">
        <div id="alunos-loading" class="loading">
          <div class="spinner"></div>
          <div class="loading-text">Carregando alunos...</div>
        </div>
        <div id="alunos-content" style="display:none;"></div>
      </section>

    </div>
  </main>
</div>

<!-- MODAL ENVIAR TREINO -->
<div id="modal-treino">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Enviar treino</div>
      <button class="btn-close" onclick="closeTreinoModal()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:20px;padding:12px 16px;background:rgba(200,240,71,0.06);border:1px solid rgba(200,240,71,0.15);">
        <div style="font-family:var(--mono);font-size:9px;color:var(--gray-500);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">Para</div>
        <div style="font-size:14px;font-weight:600;color:var(--accent);" id="treino-aluno-nome">—</div>
      </div>
      <div class="form-field">
        <label class="form-label">Título do treino</label>
        <input class="form-input" type="text" id="treino-titulo" placeholder="Ex: Treino A — Peito e Tríceps">
      </div>
      <div class="form-field">
        <label class="form-label">Descrição (opcional)</label>
        <input class="form-input" type="text" id="treino-desc" placeholder="Ex: Foco em hipertrofia, 60s de descanso">
      </div>
      <div class="form-field">
        <label class="form-label">Exercícios</label>
        <div id="exercicios-list"></div>
        <button class="btn-add-ex" onclick="addEx()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Adicionar exercício
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-salvar" onclick="enviarTreino()">Enviar treino →</button>
    </div>
  </div>
</div>

<!-- PANEL ALUNO DETALHE -->
<div id="modal-aluno" onclick="closeAlunoPanel(event)">
  <div class="aluno-panel">
    <div class="panel-header">
      <div class="modal-title" id="panel-aluno-nome">Aluno</div>
      <button class="btn-close" onclick="document.getElementById('modal-aluno').classList.remove('open')">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-aluno-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://surprising-charm-production-533e.up.railway.app';
let token = localStorage.getItem('bg_token');
let alunosData = [];
let currentAlunoId = null;
let exCount = 0;

if (!token) window.location.href = 'index.html';

async function init() {
  try {
    const res  = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok || !data.user) { logout(); return; }
    if (data.user.role !== 'personal') { window.location.href = 'dashboard-aluno.html'; return; }

    const name = data.user.name;
    document.getElementById('sidebar-name').textContent = name;
    document.body.style.visibility = 'visible';
    document.getElementById('sidebar-avatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('topbar-user').textContent = name;

    loadOverview();
  } catch { logout(); }
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`section-${id}`).classList.add('active');
  btn.classList.add('active');
  const titles = { overview: 'VISÃO GERAL', alunos: 'MEUS ALUNOS' };
  document.getElementById('topbar-title').textContent = titles[id];
  if (id === 'alunos') loadAlunos();
}

async function loadOverview() {
  try {
    const res  = await fetch(`${API}/personal/alunos`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    alunosData = data.alunos || [];

    document.getElementById('overview-loading').style.display = 'none';
    document.getElementById('overview-content').style.display = 'block';

    const ativos    = alunosData.filter(a => a.status === 'ativo');
    const pendentes = alunosData.filter(a => a.status === 'pendente');

    // Stats
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card"><div class="stat-label">Alunos ativos</div><div class="stat-value accent">${ativos.length}</div><div class="stat-sub">com vínculo confirmado</div></div>
      <div class="stat-card"><div class="stat-label">Pendentes</div><div class="stat-value">${pendentes.length}</div><div class="stat-sub">aguardando confirmação</div></div>
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${alunosData.length}</div><div class="stat-sub">alunos no sistema</div></div>
      <div class="stat-card"><div class="stat-label">Cancelados</div><div class="stat-value">${alunosData.filter(a=>a.status==='cancelado').length}</div><div class="stat-sub">vínculos encerrados</div></div>
    `;

    // Badge nav
    if (pendentes.length > 0) {
      const badge = document.getElementById('badge-alunos');
      badge.style.display = 'block';
      badge.textContent = pendentes.length;
    }

    // Pendentes
    if (pendentes.length > 0) {
      document.getElementById('pendentes-section').style.display = 'block';
      document.getElementById('pendentes-list').innerHTML = pendentes.map(a => `
        <div class="pendente-card">
          <div class="pendente-avatar">${a.name.charAt(0).toUpperCase()}</div>
          <div class="pendente-info">
            <div class="pendente-name">${a.name}</div>
            <div class="pendente-meta">${a.email} · solicitado em ${new Date(a.vinculo_desde).toLocaleDateString('pt-BR')}</div>
          </div>
          <div class="pendente-actions">
            <button class="btn-aceitar" onclick="responderVinculo(${a.aluno_id}, 'aceitar', this)">Aceitar</button>
            <button class="btn-recusar" onclick="responderVinculo(${a.aluno_id}, 'recusar', this)">Recusar</button>
          </div>
        </div>
      `).join('');
    }

    // Ativos
    if (ativos.length > 0) {
      document.getElementById('ativos-list').innerHTML = `
        <div class="alunos-grid">
          ${ativos.map(a => renderAlunoCard(a)).join('')}
        </div>
      `;
    } else {
      document.getElementById('ativos-list').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">👥</div>
          <div class="empty-title">Nenhum aluno ativo</div>
          <div class="empty-sub">Quando um aluno solicitar vínculo e você aceitar, ele aparecerá aqui.</div>
        </div>
      `;
    }
  } catch {
    document.getElementById('overview-loading').style.display = 'none';
  }
}

function renderAlunoCard(a) {
  const objetivoMap = { emagrecer:'Emagrecer', massa:'Ganhar massa', condicionamento:'Condicionamento', saude:'Saúde' };
  const nivelMap    = { iniciante:'Iniciante', intermediario:'Interm.', avancado:'Avançado' };

  return `
    <div class="aluno-card">
      <div class="aluno-card-top">
        <div class="aluno-avatar">${a.name.charAt(0).toUpperCase()}</div>
        <div class="aluno-info">
          <div class="aluno-name">${a.name}</div>
          <div class="aluno-email">${a.email}</div>
        </div>
      </div>
      <div class="aluno-stats">
        <div class="aluno-stat"><div class="aluno-stat-label">Peso</div><div class="aluno-stat-val">${a.peso || '—'}</div></div>
        <div class="aluno-stat"><div class="aluno-stat-label">Altura</div><div class="aluno-stat-val">${a.altura || '—'}</div></div>
        <div class="aluno-stat"><div class="aluno-stat-label">Freq.</div><div class="aluno-stat-val">${a.frequencia || '—'}x</div></div>
      </div>
      <div class="aluno-tags">
        ${a.objetivo ? `<span class="tag">${objetivoMap[a.objetivo] || a.objetivo}</span>` : ''}
        ${a.nivel ? `<span class="tag tag-gray">${nivelMap[a.nivel] || a.nivel}</span>` : ''}
        ${(a.restricoes||[]).slice(0,2).map(r => `<span class="tag tag-gray">${r}</span>`).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-enviar-treino" style="flex:1;" onclick="openTreinoModal(${a.aluno_id}, '${a.name.replace(/'/g,"\\'")}')">Enviar treino →</button>
        <button style="background:transparent;border:1px solid var(--border2);color:var(--gray-500);padding:10px 14px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;transition:all 0.2s;" onmouseover="this.style.borderColor='rgba(255,255,255,0.3)';this.style.color='#fff'" onmouseout="this.style.borderColor='rgba(255,255,255,0.12)';this.style.color='#888'" onclick="openAlunoPanel(${a.aluno_id})">Ver perfil</button>
      </div>
    </div>
  `;
}

async function loadAlunos() {
  if (alunosData.length > 0) {
    document.getElementById('alunos-loading').style.display = 'none';
    document.getElementById('alunos-content').style.display = 'block';
    renderAlunosSection();
    return;
  }
  try {
    const res  = await fetch(`${API}/personal/alunos`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    alunosData = data.alunos || [];
    document.getElementById('alunos-loading').style.display = 'none';
    document.getElementById('alunos-content').style.display = 'block';
    renderAlunosSection();
  } catch {
    document.getElementById('alunos-loading').style.display = 'none';
  }
}

function renderAlunosSection() {
  const ativos = alunosData.filter(a => a.status === 'ativo');
  if (!ativos.length) {
    document.getElementById('alunos-content').innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">Nenhum aluno ainda</div><div class="empty-sub">Seus alunos ativos aparecerão aqui.</div></div>`;
    return;
  }
  document.getElementById('alunos-content').innerHTML = `<div class="alunos-grid">${ativos.map(a => renderAlunoCard(a)).join('')}</div>`;
}

async function responderVinculo(alunoId, acao, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`${API}/personal/vinculo/${alunoId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ acao })
    });
    const data = await res.json();
    if (res.ok) {
      showToast(acao === 'aceitar' ? 'Vínculo aceito!' : 'Vínculo recusado.');
      alunosData = [];
      loadOverview();
    } else {
      showToast(data.error || 'Erro.');
      btn.disabled = false;
      btn.textContent = acao === 'aceitar' ? 'Aceitar' : 'Recusar';
    }
  } catch {
    showToast('Erro de conexão.');
    btn.disabled = false;
  }
}

// ── Modal treino ─────────────────────────────────────────────
function openTreinoModal(alunoId, alunoNome) {
  currentAlunoId = alunoId;
  document.getElementById('treino-aluno-nome').textContent = alunoNome;
  document.getElementById('treino-titulo').value = '';
  document.getElementById('treino-desc').value = '';
  document.getElementById('exercicios-list').innerHTML = '';
  exCount = 0;
  addEx();
  document.getElementById('modal-treino').classList.add('open');
}

function closeTreinoModal() { document.getElementById('modal-treino').classList.remove('open'); }

function addEx() {
  exCount++;
  const div = document.createElement('div');
  div.className = 'exercicio-row';
  div.id = `ex-${exCount}`;
  div.innerHTML = `
    <input class="form-input" type="text" placeholder="Nome do exercício" data-ex="nome">
    <input class="form-input" type="number" placeholder="Séries" value="3" data-ex="series" min="1">
    <input class="form-input" type="text" placeholder="Reps" value="12" data-ex="reps">
    <input class="form-input" type="text" placeholder="Peso kg" data-ex="peso">
    <button class="btn-remove-ex" onclick="document.getElementById('ex-${exCount}').remove()">×</button>
  `;
  document.getElementById('exercicios-list').appendChild(div);
}

async function enviarTreino() {
  const titulo = document.getElementById('treino-titulo').value.trim();
  if (!titulo) { showToast('Informe o título do treino.'); return; }

  const rows = document.querySelectorAll('#exercicios-list .exercicio-row');
  const exercicios = Array.from(rows).map(row => ({
    nome:   row.querySelector('[data-ex="nome"]').value.trim(),
    series: parseInt(row.querySelector('[data-ex="series"]').value) || 3,
    reps:   row.querySelector('[data-ex="reps"]').value || '12',
    peso:   row.querySelector('[data-ex="peso"]').value || '',
  })).filter(e => e.nome);

  try {
    const res = await fetch(`${API}/personal/treino`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ aluno_id: currentAlunoId, titulo, descricao: document.getElementById('treino-desc').value, exercicios })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('Treino enviado!');
      closeTreinoModal();
    } else {
      showToast(data.error || 'Erro ao enviar.');
    }
  } catch { showToast('Erro de conexão.'); }
}

// ── Panel aluno ──────────────────────────────────────────────
async function openAlunoPanel(alunoId) {
  const aluno = alunosData.find(a => a.aluno_id === alunoId);
  if (!aluno) return;

  const objetivoMap = { emagrecer:'Emagrecer', massa:'Ganhar massa', condicionamento:'Condicionamento', saude:'Saúde geral' };
  const nivelMap    = { iniciante:'Iniciante', intermediario:'Intermediário', avancado:'Avançado' };
  const imc = aluno.peso && aluno.altura ? (aluno.peso / ((aluno.altura/100)**2)).toFixed(1) : '—';

  document.getElementById('panel-aluno-nome').textContent = aluno.name;

  document.getElementById('panel-aluno-body').innerHTML = `
    <div class="info-block">
      <div class="info-block-title">Dados físicos</div>
      <div class="info-row"><span class="info-key">Idade</span><span class="info-val">${aluno.idade || '—'} anos</span></div>
      <div class="info-row"><span class="info-key">Peso</span><span class="info-val">${aluno.peso || '—'} kg</span></div>
      <div class="info-row"><span class="info-key">Altura</span><span class="info-val">${aluno.altura || '—'} cm</span></div>
      <div class="info-row"><span class="info-key">IMC</span><span class="info-val">${imc}</span></div>
    </div>
    <div class="info-block">
      <div class="info-block-title">Objetivo e nível</div>
      <div class="info-row"><span class="info-key">Objetivo</span><span class="info-val">${objetivoMap[aluno.objetivo] || '—'}</span></div>
      <div class="info-row"><span class="info-key">Nível</span><span class="info-val">${nivelMap[aluno.nivel] || '—'}</span></div>
      <div class="info-row"><span class="info-key">Frequência</span><span class="info-val">${aluno.frequencia || '—'}x por semana</span></div>
    </div>
    ${(aluno.restricoes||[]).length ? `
    <div class="info-block">
      <div class="info-block-title">Restrições</div>
      <div style="padding:8px 0;">${aluno.restricoes.map(r => `<span class="tag tag-gray">${r}</span>`).join(' ')}</div>
    </div>` : ''}
    ${aluno.obs ? `<div class="info-block"><div class="info-block-title">Observações</div><p style="font-size:13px;color:var(--gray-500);line-height:1.6;padding:4px 0;">${aluno.obs}</p></div>` : ''}
    <div class="info-block">
      <div class="info-block-title">Treinos enviados</div>
      <div class="treinos-do-aluno" id="treinos-do-aluno-${alunoId}">
        <div class="loading-text" style="padding:16px 0;">Carregando...</div>
      </div>
    </div>
    <button class="btn-salvar" style="width:100%;margin-top:8px;" onclick="openTreinoModal(${aluno.aluno_id}, '${aluno.name.replace(/'/g,"\\'")}');document.getElementById('modal-aluno').classList.remove('open')">Enviar novo treino →</button>
  `;

  document.getElementById('modal-aluno').classList.add('open');

  // Carrega treinos
  try {
    const res  = await fetch(`${API}/personal/treinos/${alunoId}`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    const treinos = data.treinos || [];
    const el = document.getElementById(`treinos-do-aluno-${alunoId}`);
    if (!treinos.length) {
      el.innerHTML = '<div style="font-size:13px;color:var(--gray-700);padding:8px 0;">Nenhum treino enviado ainda.</div>';
    } else {
      el.innerHTML = treinos.map(t => `
        <div class="treino-item">
          <div>
            <div class="treino-item-nome">${t.titulo}</div>
            <div class="treino-item-meta">${(t.exercicios||[]).length} exercícios · ${new Date(t.created_at).toLocaleDateString('pt-BR')}</div>
          </div>
          <span class="treino-status ${t.status === 'concluido' ? 'status-concluido' : 'status-pendente'}">${t.status === 'concluido' ? '✓ Feito' : 'Pendente'}</span>
        </div>
      `).join('');
    }
  } catch {}
}

function closeAlunoPanel(e) {
  if (e.target === document.getElementById('modal-aluno'))
    document.getElementById('modal-aluno').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function logout() {
  localStorage.removeItem('bg_token');
  localStorage.removeItem('bg_role');
  window.location.href = 'index.html';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeTreinoModal();
    document.getElementById('modal-aluno').classList.remove('open');
  }
});

init();
</script>
</body>
</html>
